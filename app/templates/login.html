{% extends "base.html" %}
{% block title %}Sign in · Invoice Integrity{% endblock %}
{% block content %}
<section class="card auth-card">
  <span class="eyebrow">Protected workspace</span>
  <h1>Sign in to Invoice Integrity</h1>
  <p class="muted">Invoice evidence and report delivery are restricted to authorized reviewers.</p>
  <form action="/login" method="post">
    <input type="hidden" name="csrf_token" value="{{ login_csrf_token }}">
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
