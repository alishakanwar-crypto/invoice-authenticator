<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoice Integrity{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">II</span>
      <span><strong>Invoice Integrity</strong><small>Evidence-backed verification</small></span>
    </a>
    <div class="topbar-note">
      <span>Accuracy before automation</span>
      {% if csrf_token %}
      <form action="/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">Sign out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  <footer>
    Automated results support human review. Verify high-risk invoices with authoritative records.
  </footer>
</body>
</html>
