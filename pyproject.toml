[project]
name = "invoice-authenticator"
version = "0.1.0"
description = "Evidence-backed invoice authenticity and tampering review dashboard"
requires-python = ">=3.10"
dependencies = [
  "aiosmtplib==4.0.1",
  "fastapi[standard]==0.115.12",
  "jinja2==3.1.6",
  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "pillow==11.2.1",
  "pymupdf==1.25.5",
  "pytesseract==0.3.13",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.16.0",
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
