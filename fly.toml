# Fly.io configuration for the Invoice Integrity dashboard.
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'invoice-integrity-dashboard'
primary_region = 'bom'

[build]

[env]
  ADMIN_USERNAME = 'admin'
  DATA_DIR = '/data'
  PUBLIC_BASE_URL = 'https://invoice-integrity-dashboard.fly.dev'
  UPLOAD_DIR = '/data/uploads'

[mounts]
  source = 'invoice_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
